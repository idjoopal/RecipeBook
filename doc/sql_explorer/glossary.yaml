# SQL Explorer 비즈니스 용어 사전 예시
# 실제 도메인에 맞게 수정하세요.
# 경로: doc/sql_explorer/glossary.yaml (기본값)

terms:
  - term: "매출"
    definition: "orders 테이블의 amount 컬럼 합계. VAT 포함 금액."
    tables: ["orders"]

  - term: "환불율"
    definition: "환불 건수 / 전체 주문 건수. refunds와 orders 조인 후 계산."
    tables: ["orders", "refunds"]

  - term: "완료 주문"
    definition: "status = 'COMPLETED'인 주문. status 컬럼은 대문자 enum."
    tables: ["orders"]

  - term: "지난달"
    definition: "실행 시점 기준 전월 1일 00:00 ~ 말일 23:59. order_date 컬럼 기준 필터."
    tables: ["orders"]

  - term: "활성 매장"
    definition: "stores 테이블에 존재하며 주문이 1건 이상 있는 매장."
    tables: ["stores", "orders"]
