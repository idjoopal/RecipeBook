[project]
name = "prebuilt-mcp"
version = "0.1.0"
description = "FastAPI + FastMCP 기반 MCP 서버 뼈대"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "cohere>=5.0.0",
    "fastapi>=0.128.0",
    "fastmcp>=2.14.3",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "opensearch-py>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
    # cookbook MCP
    "rank-bm25>=0.2.2",
    "python-frontmatter>=1.1.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
# Cookbook 한국어 형태소 토크나이저 (선택). COOKBOOK_TOKENIZER=kiwi 사용 시 필요.
korean = ["kiwipiepy>=0.17.0"]
